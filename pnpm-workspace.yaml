packages:
  - .

auditLevel: low
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
# esbuild and the OpenCode test binary require their platform installers.
allowBuilds:
  esbuild@0.28.1: true
  "@opencode/cli@2.0.27": true
pmOnFail: error
verifyDepsBeforeRun: error
engineStrict: true
nodeVersion: 22.23.2
