packages:
  - .

auditLevel: low
minimumReleaseAge: 1440
# The requested migration target was released today. Limit the age exception to this release.
minimumReleaseAgeExclude:
  - "@opencode/ai@2.0.28"
  - "@opencode/cli@2.0.28"
  - "@opencode/cli-darwin-arm64@2.0.28"
  - "@opencode/cli-darwin-x64@2.0.28"
  - "@opencode/cli-darwin-x64-baseline@2.0.28"
  - "@opencode/cli-linux-arm64@2.0.28"
  - "@opencode/cli-linux-arm64-musl@2.0.28"
  - "@opencode/cli-linux-x64@2.0.28"
  - "@opencode/cli-linux-x64-baseline@2.0.28"
  - "@opencode/cli-linux-x64-baseline-musl@2.0.28"
  - "@opencode/cli-linux-x64-musl@2.0.28"
  - "@opencode/cli-windows-arm64@2.0.28"
  - "@opencode/cli-windows-x64@2.0.28"
  - "@opencode/cli-windows-x64-baseline@2.0.28"
  - "@opencode/client@2.0.28"
  - "@opencode/plugin@2.0.28"
  - "@opencode/protocol@2.0.28"
  - "@opencode/schema@2.0.28"
  - "@opencode/util@2.0.28"
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
# esbuild and the OpenCode test binary require their platform installers.
allowBuilds:
  esbuild@0.28.1: true
  "@opencode/cli@2.0.28": true
pmOnFail: error
verifyDepsBeforeRun: error
engineStrict: true
nodeVersion: 22.23.2
