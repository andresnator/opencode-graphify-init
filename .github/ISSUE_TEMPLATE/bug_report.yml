name: Bug report
description: Report a reproducible, non-security plugin problem
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Do not post secrets or vulnerability details. Use [private vulnerability reporting](https://github.com/andresnator/opencode-graphify-init/security/advisories/new) for security issues.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      placeholder: 1.18.13
    validations:
      required: true
  - type: input
    id: graphify-version
    attributes:
      label: Graphify version
      placeholder: 0.9.32
    validations:
      required: true
  - type: dropdown
    id: recorded-mode
    attributes:
      label: Recorded mode
      options: [code-only, docs, no mode file, unknown]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, shell, Node.js, and repository shape.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include the exact visible error when relevant.
    validations:
      required: true
  - type: textarea
    id: sanitized-logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, names, private paths, repository data, and backend secrets. Write `None` when unavailable.
    validations:
      required: true
